# Prvital — Apple client (XcodeGen spec)
#
# Generate the Xcode project on a Mac with:
#   brew install xcodegen
#   cd prvital-ios && xcodegen generate && open Prvital.xcodeproj
#
# A premium diabetes-monitoring app for iPhone (iOS 26 / Swift 6), with a
# WidgetKit extension and an Apple Watch app. All three share the code under
# Shared/ and the Theme, and the app + watch also share Connectivity/.
#   - Prvital         — iPhone app (SwiftData, HealthKit, CloudKit, Charts)
#   - PrvitalWidgets  — Home Screen + Lock Screen widgets
#   - PrvitalWatch    — Apple Watch companion
name: Prvital
options:
  bundleIdPrefix: com.prvital
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "145"
    DEVELOPMENT_TEAM: "SU92TVZT8W" # Apple Developer Team ID
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Prvital:
    type: application
    platform: iOS
    sources:
      - path: Prvital
      - path: Shared
      - path: Connectivity # WatchConnectivity bridge (app + watch only)
    dependencies:
      - target: PrvitalWidgets
    scheme:
      testTargets:
        - PrvitalTests
    info:
      path: Prvital/Resources/Info.plist
      properties:
        CFBundleDisplayName: Prvital
        # Pin the build number and marketing version to the project settings so
        # every CURRENT_PROJECT_VERSION bump actually changes CFBundleVersion in
        # the built binary. Without this the archive shipped a fixed build number,
        # so TestFlight rejected each new upload as a duplicate (masked as success
        # by the uploader's "already used" tolerance) and the visible build never
        # advanced past 35.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - ro
          - de
          - es
          - fr
          - it
          - nl
          - pl
          - pt
          - ru
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.prvital.app
            CFBundleURLSchemes:
              - prvital
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.prvital.refresh
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: >-
          Prvital uses Bluetooth to connect to your blood-glucose meter (such as
          Contour or Accu-Chek) and import its readings.
        NSCameraUsageDescription: >-
          Prvital uses the camera to scan food barcodes and look up their
          nutrition and carbohydrate content.
        NSHealthShareUsageDescription: >-
          Prvital reads your glucose, insulin, carbohydrate and workout
          data from Apple Health so your journal stays complete automatically.
        NSHealthUpdateUsageDescription: >-
          Prvital saves the glucose, insulin and carbohydrate entries you
          log back to Apple Health so the rest of your Health apps stay in sync.
    entitlements:
      path: Prvital/Resources/Prvital.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # NOTE: com.apple.developer.default-data-protection was removed. Its value
        # (NSFileProtectionCompleteUntilFirstUserAuthentication) is already the iOS
        # default protection class, so the entitlement was a no-op — but with a
        # SIGNED archive it requires the "Data Protection" capability on the App ID
        # (which App Store Connect's API can't toggle), and its absence failed the
        # archive. The critical files are relaxed explicitly at runtime anyway:
        # PersistenceController.relaxFileProtection for the store, and SharedStore
        # for the widget snapshot. So dropping the entitlement changes no behavior.
        # Lets urgent low/high alerts use the .timeSensitive interruption level so
        # they can break through Focus and scheduled summaries.
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups:
          - group.com.prvital
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.prvital
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prvital.app
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # Manual signing so the ARCHIVE is signed with the CI-minted profile and
        # the capability entitlements (HealthKit, App Group, iCloud) are baked into
        # the binary. The previous unsigned archive + export re-sign stripped every
        # capability entitlement — the signed app had healthkit=NO appgroup=NO,
        # which broke Apple Health ("missing entitlement") and the widgets (no
        # shared container). The test/build jobs pass CODE_SIGNING_ALLOWED=NO, which
        # bypasses these. The profile name is fixed (no run-id suffix) so it can be
        # referenced here; CI recreates it each run.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Prvital App Store CI"

  PrvitalWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PrvitalWidgets
      - path: Shared
      - path: Prvital/DesignSystem/Theme.swift # reuse the palette
      - path: Prvital/Resources/Localizable.xcstrings # shared string catalog
    info:
      path: PrvitalWidgets/Info.plist
      properties:
        CFBundleDisplayName: Glucose
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PrvitalWidgets/PrvitalWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.prvital
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prvital.app.widgets
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        # See the Prvital target: manual signing so the widget's App Group
        # entitlement survives into the signed binary (was appgroup=NO).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Prvital Widgets App Store CI"

  PrvitalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PrvitalTests
    dependencies:
      - target: Prvital
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prvital.app.tests
        GENERATE_INFOPLIST_FILE: YES

  PrvitalWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: PrvitalWatch
      - path: Shared
      - path: Connectivity # WatchConnectivity bridge
      - path: Prvital/DesignSystem/Theme.swift # reuse the palette
      - path: Prvital/Resources/Localizable.xcstrings # shared string catalog
    dependencies:
      - target: PrvitalWatchWidgets
    info:
      path: PrvitalWatch/Info.plist
      properties:
        CFBundleDisplayName: Journal
        WKApplication: true
    entitlements:
      path: PrvitalWatch/PrvitalWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.prvital
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prvital.app.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PrvitalWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: PrvitalWatchWidgets
      - path: Shared
      - path: PrvitalWidgets/GlucoseTimelineProvider.swift # reuse the provider
      - path: PrvitalWidgets/GlucoseAccessoryWidgets.swift  # reuse the accessory views
      - path: Prvital/DesignSystem/Theme.swift # Color(hex:)
      - path: Prvital/Resources/Localizable.xcstrings # shared string catalog
    info:
      path: PrvitalWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Glucose
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: PrvitalWatchWidgets/PrvitalWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.prvital
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prvital.app.watchkitapp.widgets
        GENERATE_INFOPLIST_FILE: NO
        GENERATE_INFOPLIST_FILE: NO
