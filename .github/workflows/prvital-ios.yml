name: Prvital (Apple)

# Builds the Prvital native app on a macOS runner so Swift compilation
# is validated in CI (the Linux `ci.yml` can't build Xcode projects). Runs only
# when the app's sources change. Targets iOS/watchOS 26 + Swift 6, Xcode 26
# (`latest-stable`), with no code signing.
on:
  push:
    branches: ["**"]
    tags: ["testflight-*"]
    paths:
      - "prvital-ios/**"
      - ".github/workflows/prvital-ios.yml"
  pull_request:
    paths:
      - "prvital-ios/**"
      - ".github/workflows/prvital-ios.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Also archive and upload to TestFlight (requires secrets)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: prvital-ios
        run: xcodegen generate
      - name: Build iPhone app + widgets (no signing)
        working-directory: prvital-ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Prvital.xcodeproj \
            -scheme Prvital \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Run unit tests (simulator)
        working-directory: prvital-ios
        run: |
          set -o pipefail
          cat > /tmp/pick_sim.py <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"]))
          best, best_ver = "", (-1, -1)
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              try:
                  major, minor = (runtime.split("iOS-")[1].split("-") + ["0"])[:2]
                  ver = (int(major), int(minor))
              except Exception:
                  ver = (0, 0)
              for dev in devices:
                  if "iPhone" in dev["name"] and ver > best_ver:
                      best, best_ver = dev["udid"], ver
          print(best)
          PY
          UDID=$(python3 /tmp/pick_sim.py)
          if [ -z "$UDID" ]; then echo "No iOS simulator available" >&2; exit 1; fi
          echo "Testing on simulator $UDID"
          xcodebuild test \
            -project Prvital.xcodeproj \
            -scheme Prvital \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Build Apple Watch app (no signing)
        working-directory: prvital-ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Prvital.xcodeproj \
            -scheme PrvitalWatch \
            -destination 'generic/platform=watchOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

  testflight:
    # Archives the app (with its widget + watch targets) with MANUAL signing and
    # uploads the build to TestFlight via the App Store Connect API. Triggered by
    # a manual run (testflight=true), a `testflight-*` tag, or a push whose commit
    # message contains [testflight]. Requires only:
    #   ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8  (Admin key; raw .p8 or base64)
    # and the four App IDs existing in the account with their capabilities. The
    # distribution certificate and App Store profiles are created on the runner
    # via the App Store Connect API (xcodebuild's own automatic-signing service
    # rejects the key, but the REST API accepts it), then used for manual signing.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.testflight) || startsWith(github.ref, 'refs/tags/testflight-') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[testflight]')) }}
    runs-on: macos-latest
    env:
      DEVELOPMENT_TEAM: SU92TVZT8W
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: prvital-ios
        run: xcodegen generate
      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          # Accept either the raw .p8 (PEM) or a base64-encoded .p8, so the
          # secret survives copy/paste that strips newlines.
          if printf '%s' "$ASC_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_API_KEY_P8" > "$KEY_PATH"
          else
            printf '%s' "$ASC_API_KEY_P8" | tr -d '[:space:]' | openssl base64 -d -A > "$KEY_PATH"
          fi
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::ASC_API_KEY_P8 is not a valid .p8. Store the full .p8 contents (incl. the BEGIN/END lines) or the base64 of the .p8 file."
            exit 1
          fi
          # Xcode automatic signing also probes this default location for the key.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Verify App Store Connect credentials (preflight)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > /tmp/asc_preflight.rb <<'RUBY'
          require "openssl"; require "base64"; require "json"; require "net/http"
          kid = ENV["ASC_KEY_ID"].to_s
          iss = ENV["ASC_ISSUER_ID"].to_s
          key = OpenSSL::PKey.read(File.read(File.join(ENV["HOME"], "private_keys", "AuthKey_#{kid}.p8")))
          b64 = ->(s) { Base64.urlsafe_encode64(s).delete("=") }
          now = Time.now.to_i
          input = "#{b64.call({alg: "ES256", kid: kid, typ: "JWT"}.to_json)}.#{b64.call({iss: iss, iat: now, exp: now + 600, aud: "appstoreconnect-v1"}.to_json)}"
          a = OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest.new("SHA256"), input))
          r = a.value[0].value.to_s(2).rjust(32, "\x00".b)
          s = a.value[1].value.to_s(2).rjust(32, "\x00".b)
          jwt = "#{input}.#{b64.call(r + s)}"
          uri = URI("https://api.appstoreconnect.apple.com/v1/bundleIds?limit=1")
          req = Net::HTTP::Get.new(uri); req["Authorization"] = "Bearer #{jwt}"
          res = Net::HTTP.start(uri.host, uri.port, use_ssl: true) { |h| h.request(req) }
          puts "KEY_ID length=#{kid.length}  ISSUER length=#{iss.length}"
          puts "App Store Connect API (bundleIds) -> HTTP #{res.code}"
          case res.code.to_i
          when 401 then puts "==> 401: ASC_KEY_ID / ASC_ISSUER_ID / .p8 are not from the SAME key. Fix the three secrets together."
          when 403 then puts "==> 403: credentials valid but the key is NOT Admin (needed to manage provisioning). Create an Admin key."
          when 200 then puts "==> 200: credentials OK (Admin)."
          else puts res.body.to_s[0, 300]
          end
          exit(res.code.to_i == 200 ? 0 : 1)
          RUBY
          ruby /tmp/asc_preflight.rb
      - name: Create signing assets via App Store Connect API
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > /tmp/provision.rb <<'RUBY'
          require "openssl"; require "base64"; require "json"; require "net/http"; require "fileutils"
          KID = ENV["ASC_KEY_ID"].to_s
          ISS = ENV["ASC_ISSUER_ID"].to_s
          TMP = ENV["RUNNER_TEMP"]
          HOME = ENV["HOME"]
          BUNDLES = {
            "com.prvital.app" => "Prvital App Store CI",
            "com.prvital.app.widgets" => "Prvital Widgets App Store CI",
            "com.prvital.app.watchkitapp" => "Prvital Watch App Store CI",
            "com.prvital.app.watchkitapp.widgets" => "Prvital Watch Widgets App Store CI",
          }
          SIGN_KEY = OpenSSL::PKey.read(File.read(File.join(HOME, "private_keys", "AuthKey_#{KID}.p8")))
          B64 = ->(s) { Base64.urlsafe_encode64(s).delete("=") }
          def token
            now = Time.now.to_i
            input = "#{B64.call({alg: "ES256", kid: KID, typ: "JWT"}.to_json)}.#{B64.call({iss: ISS, iat: now, exp: now + 900, aud: "appstoreconnect-v1"}.to_json)}"
            a = OpenSSL::ASN1.decode(SIGN_KEY.sign(OpenSSL::Digest.new("SHA256"), input))
            r = a.value[0].value.to_s(2).rjust(32, "\x00".b); s = a.value[1].value.to_s(2).rjust(32, "\x00".b)
            "#{input}.#{B64.call(r + s)}"
          end
          def api(method, path, body = nil)
            uri = URI("https://api.appstoreconnect.apple.com#{path}")
            klass = {get: Net::HTTP::Get, post: Net::HTTP::Post, delete: Net::HTTP::Delete}[method]
            req = klass.new(uri)
            req["Authorization"] = "Bearer #{token}"; req["Content-Type"] = "application/json"
            req.body = body.to_json if body
            res = Net::HTTP.start(uri.host, uri.port, use_ssl: true) { |h| h.request(req) }
            [res.code.to_i, (res.body.to_s.empty? ? {} : (JSON.parse(res.body) rescue res.body))]
          end
          # 0) Revoke leftover distribution certificates (fresh account) so each run
          #    starts clean and never hits Apple's certificate limit. We cannot reuse
          #    an existing cert without its private key, so we always mint a new one.
          code, resp = api(:get, "/v1/certificates?filter[certificateType]=DISTRIBUTION&limit=200")
          if code == 200
            (resp["data"] || []).each do |c|
              dc, _ = api(:delete, "/v1/certificates/#{c["id"]}")
              puts "revoked existing distribution certificate #{c["id"]} (HTTP #{dc})"
            end
          end
          # 1) Apple Distribution certificate from a fresh CSR.
          csr_key = OpenSSL::PKey::RSA.new(2048)
          csr = OpenSSL::X509::Request.new
          csr.version = 0
          csr.subject = OpenSSL::X509::Name.new([["CN", "Prvital Distribution"], ["C", "RO"]])
          csr.public_key = csr_key.public_key
          csr.sign(csr_key, OpenSSL::Digest.new("SHA256"))
          code, resp = api(:post, "/v1/certificates", {data: {type: "certificates", attributes: {certificateType: "DISTRIBUTION", csrContent: csr.to_pem}}})
          abort("certificate create failed (HTTP #{code}): #{resp}") unless code == 201
          cert_id = resp["data"]["id"]
          cert = OpenSSL::X509::Certificate.new(Base64.decode64(resp["data"]["attributes"]["certificateContent"]))
          File.binwrite(File.join(TMP, "dist.p12"), OpenSSL::PKCS12.create("prvital", "Apple Distribution", csr_key, cert).to_der)
          puts "created distribution certificate #{cert_id}"
          # 2) App Store provisioning profile per bundle id.
          pp_dir = File.join(HOME, "Library/MobileDevice/Provisioning Profiles")
          FileUtils.mkdir_p(pp_dir)
          # Remove profiles left over from earlier runs so the names don't collide.
          code, resp = api(:get, "/v1/profiles?limit=200")
          if code == 200
            (resp["data"] || []).each do |p|
              next unless BUNDLES.value?(p["attributes"]["name"])
              dc, _ = api(:delete, "/v1/profiles/#{p["id"]}")
              puts "deleted stale profile '#{p["attributes"]["name"]}' (HTTP #{dc})"
            end
          end
          map = []
          BUNDLES.each do |bid, pname|
            code, resp = api(:get, "/v1/bundleIds?filter[identifier]=#{bid}&limit=1")
            abort("bundleId lookup failed for #{bid} (HTTP #{code}): #{resp}") unless code == 200
            abort("::error::App ID #{bid} does not exist. Create it in Identifiers (with its capabilities) first.") if resp["data"].empty?
            ref = resp["data"][0]["id"]
            code, resp = api(:post, "/v1/profiles", {data: {type: "profiles", attributes: {name: pname, profileType: "IOS_APP_STORE"}, relationships: {bundleId: {data: {type: "bundleIds", id: ref}}, certificates: {data: [{type: "certificates", id: cert_id}]}}}})
            abort("profile create failed for #{bid} (HTTP #{code}): #{resp}") unless code == 201
            uuid = resp["data"]["attributes"]["uuid"]
            File.binwrite(File.join(pp_dir, "#{uuid}.mobileprovision"), Base64.decode64(resp["data"]["attributes"]["profileContent"]))
            map << "#{bid}=#{pname}"
            puts "created profile '#{pname}' for #{bid} (#{uuid})"
          end
          File.write(File.join(TMP, "profile_map.txt"), map.join("\n") + "\n")
          RUBY
          ruby /tmp/provision.rb
      - name: Import certificate into keychain
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/prvital.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "prvital" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
      - name: Archive (manual signing)
        working-directory: prvital-ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Prvital.xcodeproj \
            -scheme Prvital \
            -destination 'generic/platform=iOS' \
            -archivePath build/Prvital.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/prvital.keychain-db"
      - name: Export & upload to TestFlight
        working-directory: prvital-ios
        run: |
          set -euo pipefail
          PROFILES_XML=""
          while IFS='=' read -r bundle name; do
            [ -z "$bundle" ] && continue
            PROFILES_XML="${PROFILES_XML}    <key>${bundle}</key><string>${name}</string>"$'\n'
          done < "$RUNNER_TEMP/profile_map.txt"
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0"><dict>'
            echo '  <key>method</key><string>app-store-connect</string>'
            echo '  <key>destination</key><string>upload</string>'
            echo '  <key>signingStyle</key><string>manual</string>'
            echo "  <key>teamID</key><string>${DEVELOPMENT_TEAM}</string>"
            echo '  <key>provisioningProfiles</key><dict>'
            printf '%s' "$PROFILES_XML"
            echo '  </dict>'
            echo '</dict></plist>'
          } > ExportOptions.plist
          echo "--- ExportOptions.plist ---"; cat ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/Prvital.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
