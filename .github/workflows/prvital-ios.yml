name: Prvital (Apple)

# Builds the Prvital native app on a macOS runner so Swift compilation
# is validated in CI (the Linux `ci.yml` can't build Xcode projects). Runs only
# when the app's sources change. Targets iOS/watchOS 26 + Swift 6, Xcode 26
# (`latest-stable`), with no code signing.
on:
  push:
    branches: ["**"]
    tags: ["testflight-*"]
    paths:
      - "prvital-ios/**"
      - ".github/workflows/prvital-ios.yml"
  pull_request:
    paths:
      - "prvital-ios/**"
      - ".github/workflows/prvital-ios.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Also archive and upload to TestFlight (requires secrets)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: prvital-ios
        run: xcodegen generate
      - name: Build iPhone app + widgets (no signing)
        working-directory: prvital-ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Prvital.xcodeproj \
            -scheme Prvital \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Run unit tests (simulator)
        working-directory: prvital-ios
        run: |
          set -o pipefail
          cat > /tmp/pick_sim.py <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"]))
          best, best_ver = "", (-1, -1)
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              try:
                  major, minor = (runtime.split("iOS-")[1].split("-") + ["0"])[:2]
                  ver = (int(major), int(minor))
              except Exception:
                  ver = (0, 0)
              for dev in devices:
                  if "iPhone" in dev["name"] and ver > best_ver:
                      best, best_ver = dev["udid"], ver
          print(best)
          PY
          UDID=$(python3 /tmp/pick_sim.py)
          if [ -z "$UDID" ]; then echo "No iOS simulator available" >&2; exit 1; fi
          echo "Testing on simulator $UDID"
          xcodebuild test \
            -project Prvital.xcodeproj \
            -scheme Prvital \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Build Apple Watch app (no signing)
        working-directory: prvital-ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Prvital.xcodeproj \
            -scheme PrvitalWatch \
            -destination 'generic/platform=watchOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

  testflight:
    # Archives the app (with its widget + watch targets) and uploads the build
    # to TestFlight via the App Store Connect API. Triggered by a manual run
    # (testflight=true), a `testflight-*` tag, or a push whose commit message
    # contains [testflight]. Requires these repo secrets and a DEVELOPMENT_TEAM
    # set in prvital-ios/project.yml:
    #   ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8 (raw .p8 or its base64).
    # Uses automatic signing (-allowProvisioningUpdates); the App IDs
    # (com.prvital.app + .widgets + .watchkitapp) must exist in the
    # account with HealthKit, App Groups and iCloud (CloudKit) capabilities.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.testflight) || startsWith(github.ref, 'refs/tags/testflight-') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[testflight]')) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: prvital-ios
        run: xcodegen generate
      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          # Accept either the raw .p8 (PEM) or a base64-encoded .p8, so the
          # secret survives copy/paste that strips newlines.
          if printf '%s' "$ASC_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_API_KEY_P8" > "$KEY_PATH"
          else
            printf '%s' "$ASC_API_KEY_P8" | tr -d '[:space:]' | openssl base64 -d -A > "$KEY_PATH"
          fi
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::ASC_API_KEY_P8 is not a valid .p8. Store the full .p8 contents (incl. the BEGIN/END lines) or the base64 of the .p8 file."
            exit 1
          fi
      - name: Archive
        working-directory: prvital-ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Prvital.xcodeproj \
            -scheme Prvital \
            -destination 'generic/platform=iOS' \
            -archivePath build/Prvital.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
      - name: Export & upload to TestFlight
        working-directory: prvital-ios
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Prvital.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
