name: Prvital (Apple)

# Builds the Prvital native app on a macOS runner so Swift compilation
# is validated in CI (the Linux `ci.yml` can't build Xcode projects). Runs only
# when the app's sources change. Targets iOS/watchOS 26 + Swift 6, Xcode 26
# (`latest-stable`), with no code signing.
on:
  push:
    branches: ["**"]
    tags: ["testflight-*"]
    paths:
      - "prvital-ios/**"
      - ".github/workflows/prvital-ios.yml"
  pull_request:
    paths:
      - "prvital-ios/**"
      - ".github/workflows/prvital-ios.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Also archive and upload to TestFlight (requires secrets)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: prvital-ios
        run: xcodegen generate
      - name: Build iPhone app + widgets (no signing)
        working-directory: prvital-ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Prvital.xcodeproj \
            -scheme Prvital \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Run unit tests (simulator)
        working-directory: prvital-ios
        run: |
          set -o pipefail
          cat > /tmp/pick_sim.py <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "--json"]))
          best, best_ver = "", (-1, -1)
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              try:
                  major, minor = (runtime.split("iOS-")[1].split("-") + ["0"])[:2]
                  ver = (int(major), int(minor))
              except Exception:
                  ver = (0, 0)
              for dev in devices:
                  if "iPhone" in dev["name"] and ver > best_ver:
                      best, best_ver = dev["udid"], ver
          print(best)
          PY
          UDID=$(python3 /tmp/pick_sim.py)
          if [ -z "$UDID" ]; then echo "No iOS simulator available" >&2; exit 1; fi
          echo "Testing on simulator $UDID"
          xcodebuild test \
            -project Prvital.xcodeproj \
            -scheme Prvital \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Build Apple Watch app (no signing)
        working-directory: prvital-ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Prvital.xcodeproj \
            -scheme PrvitalWatch \
            -destination 'generic/platform=watchOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

  testflight:
    # Archives the app (with its widget + watch targets) with MANUAL signing and
    # uploads the build to TestFlight via the App Store Connect API. Triggered by
    # a manual run (testflight=true), a `testflight-*` tag, or a push whose commit
    # message contains [testflight]. Requires these repo secrets:
    #   ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8  (upload — raw .p8 or base64)
    #   DIST_CERT_P12 (base64 of the Apple Distribution .p12), DIST_CERT_PASSWORD
    #   PROFILE_APP, PROFILE_WIDGETS, PROFILE_WATCH, PROFILE_WATCH_WIDGETS
    #     (base64 of the App Store .mobileprovision for each of the four bundle IDs)
    # Automatic signing over the API is not usable here (Apple's provisioning
    # service rejects the key), so certificate + profiles are supplied directly.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.testflight) || startsWith(github.ref, 'refs/tags/testflight-') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[testflight]')) }}
    runs-on: macos-latest
    env:
      DEVELOPMENT_TEAM: SU92TVZT8W
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: prvital-ios
        run: xcodegen generate
      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          # Accept either the raw .p8 (PEM) or a base64-encoded .p8, so the
          # secret survives copy/paste that strips newlines.
          if printf '%s' "$ASC_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_API_KEY_P8" > "$KEY_PATH"
          else
            printf '%s' "$ASC_API_KEY_P8" | tr -d '[:space:]' | openssl base64 -d -A > "$KEY_PATH"
          fi
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::ASC_API_KEY_P8 is not a valid .p8. Store the full .p8 contents (incl. the BEGIN/END lines) or the base64 of the .p8 file."
            exit 1
          fi
          # Xcode automatic signing also probes this default location for the key.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Verify App Store Connect credentials (preflight)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > /tmp/asc_preflight.rb <<'RUBY'
          require "openssl"; require "base64"; require "json"; require "net/http"
          kid = ENV["ASC_KEY_ID"].to_s
          iss = ENV["ASC_ISSUER_ID"].to_s
          key = OpenSSL::PKey.read(File.read(File.join(ENV["HOME"], "private_keys", "AuthKey_#{kid}.p8")))
          b64 = ->(s) { Base64.urlsafe_encode64(s).delete("=") }
          now = Time.now.to_i
          input = "#{b64.call({alg: "ES256", kid: kid, typ: "JWT"}.to_json)}.#{b64.call({iss: iss, iat: now, exp: now + 600, aud: "appstoreconnect-v1"}.to_json)}"
          a = OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest.new("SHA256"), input))
          r = a.value[0].value.to_s(2).rjust(32, "\x00".b)
          s = a.value[1].value.to_s(2).rjust(32, "\x00".b)
          jwt = "#{input}.#{b64.call(r + s)}"
          uri = URI("https://api.appstoreconnect.apple.com/v1/bundleIds?limit=1")
          req = Net::HTTP::Get.new(uri); req["Authorization"] = "Bearer #{jwt}"
          res = Net::HTTP.start(uri.host, uri.port, use_ssl: true) { |h| h.request(req) }
          puts "KEY_ID length=#{kid.length}  ISSUER length=#{iss.length}"
          puts "App Store Connect API (bundleIds) -> HTTP #{res.code}"
          case res.code.to_i
          when 401 then puts "==> 401: ASC_KEY_ID / ASC_ISSUER_ID / .p8 are not from the SAME key. Fix the three secrets together."
          when 403 then puts "==> 403: credentials valid but the key is NOT Admin (needed to manage provisioning). Create an Admin key."
          when 200 then puts "==> 200: credentials OK (Admin)."
          else puts res.body.to_s[0, 300]
          end
          exit(res.code.to_i == 200 ? 0 : 1)
          RUBY
          ruby /tmp/asc_preflight.rb
      - name: Import distribution certificate
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/prvital.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          printf '%s' "$DIST_CERT_P12" | tr -d '[:space:]' | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "Signing identities in the new keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN"
      - name: Install provisioning profiles
        env:
          PROFILE_APP: ${{ secrets.PROFILE_APP }}
          PROFILE_WIDGETS: ${{ secrets.PROFILE_WIDGETS }}
          PROFILE_WATCH: ${{ secrets.PROFILE_WATCH }}
          PROFILE_WATCH_WIDGETS: ${{ secrets.PROFILE_WATCH_WIDGETS }}
        run: |
          set -euo pipefail
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          : > "$RUNNER_TEMP/profile_map.txt"
          install() {
            if [ -z "$1" ]; then echo "::error::A provisioning-profile secret is empty."; exit 1; fi
            printf '%s' "$1" | tr -d '[:space:]' | openssl base64 -d -A > "$RUNNER_TEMP/pp.mobileprovision"
            security cms -D -i "$RUNNER_TEMP/pp.mobileprovision" > "$RUNNER_TEMP/pp.plist"
            uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/pp.plist")
            name=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/pp.plist")
            appid=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/pp.plist")
            bundle=${appid#*.}
            cp "$RUNNER_TEMP/pp.mobileprovision" "$PP_DIR/$uuid.mobileprovision"
            echo "$bundle=$name" >> "$RUNNER_TEMP/profile_map.txt"
            echo "installed profile '$name' for $bundle ($uuid)"
          }
          install "$PROFILE_APP"
          install "$PROFILE_WIDGETS"
          install "$PROFILE_WATCH"
          install "$PROFILE_WATCH_WIDGETS"
      - name: Archive (manual signing)
        working-directory: prvital-ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Prvital.xcodeproj \
            -scheme Prvital \
            -destination 'generic/platform=iOS' \
            -archivePath build/Prvital.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/prvital.keychain-db"
      - name: Export & upload to TestFlight
        working-directory: prvital-ios
        run: |
          set -euo pipefail
          PROFILES_XML=""
          while IFS='=' read -r bundle name; do
            [ -z "$bundle" ] && continue
            PROFILES_XML="${PROFILES_XML}    <key>${bundle}</key><string>${name}</string>
"
          done < "$RUNNER_TEMP/profile_map.txt"
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0"><dict>'
            echo '  <key>method</key><string>app-store-connect</string>'
            echo '  <key>destination</key><string>upload</string>'
            echo '  <key>signingStyle</key><string>manual</string>'
            echo "  <key>teamID</key><string>${DEVELOPMENT_TEAM}</string>"
            echo '  <key>provisioningProfiles</key><dict>'
            printf '%s' "$PROFILES_XML"
            echo '  </dict>'
            echo '</dict></plist>'
          } > ExportOptions.plist
          echo "--- ExportOptions.plist ---"; cat ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/Prvital.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
