name: Diabetes Journal (Apple)

# Builds the Diabetes Journal native app on a macOS runner so Swift compilation
# is validated in CI (the Linux `ci.yml` can't build Xcode projects). Runs only
# when the app's sources change. Targets iOS/watchOS 26 + Swift 6, Xcode 26
# (`latest-stable`), with no code signing.
on:
  push:
    branches: ["**"]
    paths:
      - "diabetes-journal-ios/**"
      - ".github/workflows/diabetes-ios.yml"
  pull_request:
    paths:
      - "diabetes-journal-ios/**"
      - ".github/workflows/diabetes-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: diabetes-journal-ios
        run: xcodegen generate
      - name: Build iPhone app + widgets (no signing)
        working-directory: diabetes-journal-ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project DiabetesJournal.xcodeproj \
            -scheme DiabetesJournal \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Build Apple Watch app (no signing)
        working-directory: diabetes-journal-ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project DiabetesJournal.xcodeproj \
            -scheme DiabetesJournalWatch \
            -destination 'generic/platform=watchOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
