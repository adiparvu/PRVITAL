name: Diabetes Journal (Apple)

# Builds the Diabetes Journal native app on a macOS runner so Swift compilation
# is validated in CI (the Linux `ci.yml` can't build Xcode projects). Runs only
# when the app's sources change. Targets iOS/watchOS 26 + Swift 6, Xcode 26
# (`latest-stable`), with no code signing.
on:
  push:
    branches: ["**"]
    paths:
      - "diabetes-journal-ios/**"
      - ".github/workflows/diabetes-ios.yml"
  pull_request:
    paths:
      - "diabetes-journal-ios/**"
      - ".github/workflows/diabetes-ios.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Also archive and upload to TestFlight (requires secrets)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: diabetes-journal-ios
        run: xcodegen generate
      - name: Build iPhone app + widgets (no signing)
        working-directory: diabetes-journal-ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project DiabetesJournal.xcodeproj \
            -scheme DiabetesJournal \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Build Apple Watch app (no signing)
        working-directory: diabetes-journal-ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project DiabetesJournal.xcodeproj \
            -scheme DiabetesJournalWatch \
            -destination 'generic/platform=watchOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

  testflight:
    # Manual only. Archives the app (with its widget + watch targets) and uploads
    # the build to TestFlight via the App Store Connect API. Requires these repo
    # secrets and a DEVELOPMENT_TEAM set in diabetes-journal-ios/project.yml:
    #   ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8 (the .p8 file contents).
    # Uses automatic signing (-allowProvisioningUpdates); the App IDs
    # (com.diabetesjournal.app + .widgets + .watchkitapp) must exist in the
    # account with HealthKit, App Groups and iCloud (CloudKit) capabilities.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: diabetes-journal-ios
        run: xcodegen generate
      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$ASC_API_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Archive
        working-directory: diabetes-journal-ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project DiabetesJournal.xcodeproj \
            -scheme DiabetesJournal \
            -destination 'generic/platform=iOS' \
            -archivePath build/DiabetesJournal.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
      - name: Export & upload to TestFlight
        working-directory: diabetes-journal-ios
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/DiabetesJournal.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
